name: Deploy crawler control Worker
on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm install --global wrangler@4
      - name: Deploy Worker
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler deploy
      - name: Configure Worker secrets
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_TOKEN_VALUE: ${{ secrets.CRAWLER_GITHUB_TOKEN }}
          CONTROL_TOKEN_VALUE: ${{ secrets.CRAWLER_CONTROL_TOKEN }}
        run: |
          printf '%s' "$GITHUB_TOKEN_VALUE" | wrangler secret put GITHUB_TOKEN
          printf '%s' "$CONTROL_TOKEN_VALUE" | wrangler secret put CRAWLER_CONTROL_TOKEN
