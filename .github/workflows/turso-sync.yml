name: Sync Index Results to D1 through Worker

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions default timezone (UTC): daily at 01:00.
    - cron: '0 1 * * *'

permissions:
  contents: write

concurrency:
  group: baheth-local-crawler-db
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CRAWLER_DB_PATH: /tmp/crawler.sqlite
      SUPABASE_URL: https://ysntytwkggxdapokglsc.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_REPLACE_RESULTS: 'true'
      INGEST_URL: ${{ secrets.INGEST_URL }}
      INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
      INGEST_BATCH_SIZE: '16'
      INGEST_MAX_ROWS: '0'
      INGEST_RETRIES: '5'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate Supabase secret
        run: test -n "$SUPABASE_SERVICE_ROLE_KEY"
      - name: Pull crawler state from Supabase
        run: node tools/pull-supabase-to-local.mjs
      - name: Validate Worker ingest secrets
        run: |
          test -n "$INGEST_URL"
          test -n "$INGEST_TOKEN"
      - name: Transfer index results to D1 through Worker
        run: node tools/sync-to-ingest-worker.mjs
      - name: Verify local database only
        run: |
          node --input-type=module <<'NODE'
          import Database from 'better-sqlite3';
          const db = new Database('db/crawler.sqlite', { readonly: true });
          if (db.prepare('PRAGMA integrity_check').get().integrity_check !== 'ok') throw new Error('Database integrity check failed');
          const remaining = db.prepare('SELECT COUNT(*) AS count FROM index_results').get().count;
          if (remaining !== 0) throw new Error(`Local index_results still contains ${remaining} rows`);
          console.log(JSON.stringify({ index_results_remaining: remaining, integrity: 'ok', remote_checks: 'disabled' }, null, 2));
          db.close();
          NODE
      - name: Push synchronized crawler state to Supabase
        run: node tools/push-local-to-supabase.mjs
