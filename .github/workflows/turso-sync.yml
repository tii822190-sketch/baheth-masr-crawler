name: Sync Index Results to Turso

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions cron uses UTC: daily at 01:00 UTC.
    - cron: '0 1 * * *'

permissions:
  contents: write

concurrency:
  group: baheth-local-crawler-db
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CRAWLER_DB_PATH: db/crawler.sqlite
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      TURSO_PAGES_TABLE: search_pages
      TURSO_FTS_TABLE: search_pages_fts
      TURSO_BATCH_SIZE: '500'
      # Temporary production test cap: transfer at most 30 rows per run.
      TURSO_MAX_ROWS: '30'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate Turso secrets
        run: |
          test -n "$TURSO_DATABASE_URL"
          test -n "$TURSO_AUTH_TOKEN"
      - name: Transfer index results into search pages and FTS
        run: node tools/sync-to-turso.mjs
      - name: Verify Turso search tables
        run: |
          node --input-type=module <<'NODE'
          import { createClient } from '@libsql/client';
          const client = createClient({ url: process.env.TURSO_DATABASE_URL, authToken: process.env.TURSO_AUTH_TOKEN });
          const tables = await client.execute("SELECT name FROM sqlite_master WHERE type IN ('table','virtual table') AND name IN ('index_results','search_pages','search_pages_fts') ORDER BY name");
          const names = tables.rows.map((row) => row.name);
          if (names.join(',') !== 'search_pages,search_pages_fts') throw new Error(`Unexpected Turso target tables: ${names.join(',')}`);
          const pageColumns = (await client.execute('PRAGMA table_info(search_pages)')).rows.map((row) => row.name);
          const ftsColumns = (await client.execute('PRAGMA table_info(search_pages_fts)')).rows.map((row) => row.name);
          if (pageColumns.join(',') !== 'id,url,title,description,icon_url,keywords,snippet,created_at,updated_at') throw new Error(`Unexpected search_pages columns: ${pageColumns.join(',')}`);
          if (ftsColumns.join(',') !== 'page_id,url,title,description,keywords,snippet') throw new Error(`Unexpected search_pages_fts columns: ${ftsColumns.join(',')}`);
          const pages = (await client.execute('SELECT COUNT(*) AS count FROM search_pages')).rows[0].count;
          const fts = (await client.execute('SELECT COUNT(*) AS count FROM search_pages_fts')).rows[0].count;
          if (Number(pages) !== Number(fts)) throw new Error(`FTS mismatch: search_pages=${pages}, search_pages_fts=${fts}`);
          console.log(JSON.stringify({ search_pages: pages, search_pages_fts: fts }, null, 2));
          client.close();
          NODE
      - name: Verify local database
        run: |
          node --input-type=module <<'NODE'
          import Database from 'better-sqlite3';
          const db = new Database('db/crawler.sqlite', { readonly: true });
          if (db.prepare('PRAGMA integrity_check').get().integrity_check !== 'ok') throw new Error('Database integrity check failed');
          const remaining = db.prepare('SELECT COUNT(*) AS count FROM index_results').get().count;
          console.log(JSON.stringify({ index_results_remaining: remaining, integrity: 'ok' }, null, 2));
          db.close();
          NODE
      - name: Commit cleaned local database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add db/crawler.sqlite
          if git diff --cached --quiet; then
            echo "No database changes to commit."
          else
            git commit -m "Sync index results to Turso and clean local database"
            git push origin HEAD:main
          fi
