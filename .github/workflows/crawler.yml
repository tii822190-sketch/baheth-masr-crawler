name: Baheth Masr Crawler
on:
  workflow_dispatch:
    inputs:
      run_type:
        description: Run type
        required: true
        default: daily_check
        type: choice
        options: [daily_check, weekly_refresh, manual]
      limit:
        description: Maximum seed sites for this run
        required: true
        default: '10'
      manual_url:
        description: One URL to add to discoveries
        required: true
        default: ''
      ddg_queries:
        description: Up to 3 DuckDuckGo queries separated by |
        required: false
        default: ''
      sync_production:
        description: Sync approved rows to production (manual confirmation required)
        required: true
        default: 'false'
        type: boolean
      passes:
        description: Number of crawl passes to fetch discovered pages
        required: true
        default: '1'
      drain_discoveries:
        description: Crawl discovered pages until the queue is empty
        required: true
        default: 'false'
        type: boolean
permissions:
  contents: read
jobs:
  crawl:
    runs-on: ubuntu-latest
    env:
      CRAWLER_LIMIT: ${{ github.event.inputs.limit || '10' }}
      CRAWLER_MANUAL_URL: ${{ github.event.inputs.manual_url || '' }}
      CRAWLER_DDG_QUERIES: ${{ github.event.inputs.ddg_queries || '' }}
      CRAWLER_DRAIN_DISCOVERIES: ${{ github.event.inputs.drain_discoveries == 'true' && '1' || '0' }}
      CRAWLER_MANUAL_ONLY: '1'
      CRAWLER_CONCURRENCY: '10'
      CRAWLER_FETCH_MODE: 'hybrid'
      CRAWLER_INPUT_DB_PATH: db/links.sqlite
      CRAWLER_RESULTS_DB_PATH: db/results.sqlite
      TURSO_CRAWLER_DATABASE_URL: libsql://alzahf-karamkkr.aws-eu-west-1.turso.io
      TURSO_CRAWLER_AUTH_TOKEN: ${{ secrets.TURSO_CRAWLER_AUTH_TOKEN }}
      TURSO_PRODUCTION_DATABASE_URL: ${{ secrets.TURSO_PRODUCTION_DATABASE_URL }}
      TURSO_PRODUCTION_AUTH_TOKEN: ${{ secrets.TURSO_PRODUCTION_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Apply crawler staging schema to Turso
        run: node tools/apply-turso-schema.mjs
      - name: Select scheduled mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "run_type=${{ github.event.inputs.run_type }}" >> "$GITHUB_OUTPUT"; elif [ "$(date -u +%u)" = "5" ]; then echo 'run_type=weekly_refresh' >> "$GITHUB_OUTPUT"; else echo 'run_type=daily_check' >> "$GITHUB_OUTPUT"; fi
      - run: node crawler/src/cli.mjs init
      - name: Crawl configured passes
        env:
          CRAWLER_PASSES: ${{ github.event.inputs.passes || '1' }}
        run: |
          set -e
          for pass in $(seq 1 "$CRAWLER_PASSES"); do
            echo "Starting crawl pass $pass/$CRAWLER_PASSES"
            node crawler/src/cli.mjs "${{ steps.mode.outputs.run_type }}"
            echo "Checkpointing crawl pass $pass/$CRAWLER_PASSES"
            node tools/validate-staging.mjs
            node tools/sync-turso-staging.mjs
            if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.sync_production }}" = "true" ]; then
              node tools/sync-approved-production.mjs
            fi
          done
      - name: Final checkpoint verification
        run: |
          node tools/validate-staging.mjs
          node tools/sync-turso-staging.mjs
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.sync_production }}" = "true" ]; then
            node tools/sync-approved-production.mjs
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crawler-links-and-results-${{ github.run_id }}
          path: db/*.sqlite
