name: Baheth Masr Crawler
on:
  workflow_dispatch:
    inputs:
      run_type:
        description: Run type
        required: true
        default: daily_check
        type: choice
        options: [daily_check, weekly_refresh, manual]
      limit:
        description: Maximum seed sites for this run
        required: true
        default: '10'
      manual_url:
        description: One URL to add to discoveries
        required: true
        default: ''
      ddg_queries:
        description: Up to 3 DuckDuckGo queries separated by |
        required: false
        default: ''
      sync_production:
        description: Sync approved rows to production database 1 after every batch
        required: true
        default: 'true'
        type: boolean
      passes:
        description: Number of 50-page batches to process (up to max_pages)
        required: true
        default: '10'
      drain_discoveries:
        description: Crawl discovered pages until the queue is empty
        required: true
        default: 'true'
        type: boolean
      batch_size:
        description: Pages per checkpoint batch
        required: false
        default: '50'
      max_pages:
        description: Maximum pages for this run
        required: false
        default: '500'
permissions:
  contents: read
jobs:
  crawl:
    runs-on: ubuntu-latest
    env:
      CRAWLER_LIMIT: ${{ github.event.inputs.limit || '10' }}
      CRAWLER_MANUAL_URL: ${{ github.event.inputs.manual_url || '' }}
      CRAWLER_DDG_QUERIES: ${{ github.event.inputs.ddg_queries || '' }}
      CRAWLER_DRAIN_DISCOVERIES: ${{ github.event.inputs.drain_discoveries == 'true' && '1' || '0' }}
      CRAWLER_MANUAL_ONLY: '1'
      CRAWLER_CONCURRENCY: '10'
      CRAWLER_BROWSER_CONCURRENCY: '7'
      CRAWLER_FETCH_MODE: 'hybrid'
      CRAWLER_SOURCE: 'unindexed_pages'
      CRAWLER_ONE_BATCH: '1'
      CRAWLER_BATCH_SIZE: ${{ github.event.inputs.batch_size || '50' }}
      CRAWLER_MAX_PAGES: ${{ github.event.inputs.max_pages || '500' }}
      CRAWLER_INPUT_DB_PATH: db/links.sqlite
      CRAWLER_RESULTS_DB_PATH: db/results.sqlite
      TURSO_CRAWLER_DATABASE_URL: libsql://alzahf-karamkkr.aws-eu-west-1.turso.io
      TURSO_CRAWLER_AUTH_TOKEN: ${{ secrets.TURSO_CRAWLER_AUTH_TOKEN }}
      TURSO_PRODUCTION_DATABASE_URL: ${{ secrets.TURSO_PRODUCTION_DATABASE_URL }}
      TURSO_PRODUCTION_AUTH_TOKEN: ${{ secrets.TURSO_PRODUCTION_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Apply crawler staging schema to Turso
        run: node tools/apply-turso-schema.mjs
      - name: Select scheduled mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "run_type=${{ github.event.inputs.run_type }}" >> "$GITHUB_OUTPUT"; elif [ "$(date -u +%u)" = "5" ]; then echo 'run_type=weekly_refresh' >> "$GITHUB_OUTPUT"; else echo 'run_type=daily_check' >> "$GITHUB_OUTPUT"; fi
      - run: node crawler/src/cli.mjs init
      - name: Restore previous crawler checkpoint
        run: node tools/restore-turso-staging.mjs
      - name: Crawl configured passes
        env:
          CRAWLER_PASSES: ${{ github.event.inputs.passes || '1' }}
        run: |
          set -e
          processed_pages=0
          for pass in $(seq 1 "$CRAWLER_PASSES"); do
            remaining=$((CRAWLER_MAX_PAGES - processed_pages))
            if [ "$remaining" -le 0 ]; then break; fi
            current_batch_size=$CRAWLER_BATCH_SIZE
            if [ "$current_batch_size" -gt "$remaining" ]; then current_batch_size=$remaining; fi
            export CRAWLER_BATCH_SIZE="$current_batch_size"
            echo "Starting crawl pass $pass/$CRAWLER_PASSES"
            crawl_output=$(node crawler/src/cli.mjs "${{ steps.mode.outputs.run_type }}")
            echo "$crawl_output"
            export CRAWLER_SYNC_RUN_ID=$(node -e "const x=JSON.parse(process.argv[1]); console.log(Number(x.runId)||0)" "$crawl_output")
            processed=$(node -e "const x=JSON.parse(process.argv[1]); console.log(Number(x.total)||0)" "$crawl_output")
            processed_pages=$((processed_pages + processed))
            echo "Checkpointing crawl pass $pass/$CRAWLER_PASSES"
            node tools/validate-staging.mjs
            node tools/sync-turso-staging.mjs
            if [ "${{ github.event.inputs.sync_production || 'true' }}" = "true" ]; then
              if ! sync_output=$(node tools/sync-approved-production.mjs 2>&1); then
                echo "$sync_output"
                if ! echo "$sync_output" | grep -q 'No approved staging rows available'; then exit 1; fi
              else
                echo "$sync_output"
              fi
            fi
          done
      - name: Final checkpoint verification
        run: |
          node tools/validate-staging.mjs
          node tools/sync-turso-staging.mjs
          if [ "${{ github.event.inputs.sync_production || 'true' }}" = "true" ]; then
            if ! sync_output=$(node tools/sync-approved-production.mjs 2>&1); then
              echo "$sync_output"
              if ! echo "$sync_output" | grep -q 'No approved staging rows available'; then exit 1; fi
            else
              echo "$sync_output"
            fi
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crawler-links-and-results-${{ github.run_id }}
          path: db/*.sqlite
