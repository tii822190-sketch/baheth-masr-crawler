name: Discovery Spider

on:
  workflow_dispatch:
    inputs:
      site_url:
        description: 'Optional site URL to discover directly'
        required: false
        default: ''
        type: string
      resume_incomplete:
        description: 'Resume a site whose discovery previously reached the limit'
        required: false
        default: false
        type: boolean
  schedule:
    # GitHub Actions default timezone (UTC): 19:00, 20:00, 21:00, and 22:00.
    - cron: '0 19,20,21,22 * * *'

permissions:
  contents: write

concurrency:
  group: baheth-local-crawler-db
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CRAWLER_DB_PATH: /tmp/crawler.sqlite
      SUPABASE_URL: https://ysntytwkggxdapokglsc.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_SYNC_QUEUE_DELETES: 'true'
      DISCOVERY_SITE_URL: ${{ inputs.site_url || '' }}
      DISCOVERY_MAX_PAGES_PER_SITE: '5000'
      DISCOVERY_MAX_SITEMAPS: ${{ github.ref_name == 'main' && '2000' || '100' }}
      DISCOVERY_TIMEOUT_MS: ${{ github.ref_name == 'main' && '20000' || '10000' }}
      DISCOVERY_RESUME_INCOMPLETE: ${{ inputs.resume_incomplete || false }}
      DISCOVERY_BROWSER_BUDGET_MS: '30000'
      DISCOVERY_BROWSER_SCROLL_STEPS: '6'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate Supabase secret
        run: test -n "$SUPABASE_SERVICE_ROLE_KEY"
      - name: Pull crawler state from Supabase
        run: node tools/pull-supabase-to-local.mjs
      - name: Initialize the temporary crawler database
        run: node crawler/src/cli.mjs init
      - name: Load configured site seeds
        run: node tools/load-site-seeds.mjs
      - name: Discover one pending site from all sitemaps
        run: node tools/discovery-spider.mjs
      - name: Verify local database
        run: |
          node --input-type=module <<'NODE'
          import Database from 'better-sqlite3';
          const db = new Database(process.env.CRAWLER_DB_PATH, { readonly: true });
          const tables = db.prepare("SELECT name FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%' ORDER BY name").all().map((row) => row.name);
          if (tables.join(',') !== 'index_results,site_pages,sites') throw new Error(`Unexpected tables: ${tables.join(',')}`);
          if (db.prepare('PRAGMA integrity_check').get().integrity_check !== 'ok') throw new Error('Database integrity check failed');
          console.log(JSON.stringify({ tables, sites: db.prepare('SELECT COUNT(*) AS count FROM sites').get().count, queued_pages: db.prepare('SELECT COUNT(*) AS count FROM site_pages').get().count }, null, 2));
          db.close();
          NODE
      - name: Push updated crawler state to Supabase
        run: node tools/push-local-to-supabase.mjs
