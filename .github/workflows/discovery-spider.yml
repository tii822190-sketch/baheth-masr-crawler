name: Discovery Spider
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      seed_urls:
        description: Seed URLs separated by a vertical bar
        required: false
        type: string
        default: ''
      mode:
        description: Discovery mode
        required: false
        type: choice
        options:
          - sitemap_only
          - crawl_only
          - both
        default: both
permissions:
  contents: read
concurrency:
  group: baheth-crawler-staging
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-latest
    env:
      TURSO_CRAWLER_DATABASE_URL: libsql://alzahf-karamkkr.aws-eu-west-1.turso.io
      TURSO_CRAWLER_AUTH_TOKEN: ${{ secrets.TURSO_CRAWLER_AUTH_TOKEN }}
      CRAWLER_INPUT_DB_PATH: db/links.sqlite
      DISCOVERY_MAX_SITES: '25'
      DISCOVERY_MAX_PAGES_PER_SITE: '1000'
      DISCOVERY_CHECKPOINT_SIZE: '1000'
      DISCOVERY_BROWSER_BUDGET_MS: '15000'
      DISCOVERY_REGISTER_EXTERNAL_SITES: '0'
      DISCOVERY_MAX_SITEMAP_URLS: '5000'
      DISCOVERY_MAX_ARCHIVE_URLS: '5000'
      DISCOVERY_RUN_PAGE_LIMIT: '1000'
      DISCOVERY_MODE: ${{ inputs.mode || 'both' }}
      DISCOVERY_SEED_URLS: ${{ inputs.seed_urls || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: node tools/apply-turso-schema.mjs
      - run: rm -f db/links.sqlite db/results.sqlite
      - run: node crawler/src/cli.mjs init
      - run: node tools/restore-turso-staging.mjs
      - name: Discover sites and pages only
        run: node tools/discovery-spider.mjs
