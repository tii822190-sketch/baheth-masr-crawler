name: Discovery Spider

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: baheth-local-crawler-db
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CRAWLER_DB_PATH: db/crawler.sqlite
      DISCOVERY_MAX_PAGES_PER_SITE: '10000'
      DISCOVERY_MAX_SITEMAPS: '2000'
      DISCOVERY_TIMEOUT_MS: '20000'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Discover one pending site from all sitemaps
        run: node tools/discovery-spider.mjs
      - name: Save local crawler database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add db/crawler.sqlite
          if git diff --cached --quiet; then
            echo "No database changes to commit."
          else
            git commit -m "Update local crawler database"
            git push origin HEAD:main
          fi
