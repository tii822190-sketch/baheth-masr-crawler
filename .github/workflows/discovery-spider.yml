name: Discovery Spider

on:
  workflow_dispatch:
    inputs:
      site_url:
        description: 'Optional site URL to discover directly'
        required: false
        default: ''
        type: string
      resume_incomplete:
        description: 'Resume a site whose discovery previously reached the limit'
        required: false
        default: false
        type: boolean
  schedule:
    # Egypt local time (UTC+03): 02:00, 06:00, 09:00, 13:00, 18:00, and 22:30.
    # GitHub Actions cron is UTC; the schedules below are the corresponding UTC times.
    - cron: '0 3,6,10,15,23 * * *'
    - cron: '30 19 * * *'

permissions:
  contents: write

concurrency:
  group: baheth-local-crawler-db
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CRAWLER_DB_PATH: db/crawler.sqlite
      DISCOVERY_SITE_URL: ${{ inputs.site_url || '' }}
      DISCOVERY_MAX_PAGES_PER_SITE: '5000'
      DISCOVERY_MAX_SITEMAPS: ${{ github.ref_name == 'main' && '2000' || '100' }}
      DISCOVERY_TIMEOUT_MS: ${{ github.ref_name == 'main' && '20000' || '10000' }}
      DISCOVERY_RESUME_INCOMPLETE: ${{ inputs.resume_incomplete || false }}
      DISCOVERY_BROWSER_BUDGET_MS: '30000'
      DISCOVERY_BROWSER_SCROLL_STEPS: '6'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Initialize the local three-table database
        run: node crawler/src/cli.mjs init
      - name: Load configured site seeds
        run: node tools/load-site-seeds.mjs
      - name: Discover one pending site from all sitemaps
        run: node tools/discovery-spider.mjs
      - name: Verify local database
        run: |
          node --input-type=module <<'NODE'
          import Database from 'better-sqlite3';
          const db = new Database('db/crawler.sqlite', { readonly: true });
          const tables = db.prepare("SELECT name FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%' ORDER BY name").all().map((row) => row.name);
          if (tables.join(',') !== 'index_results,site_pages,sites') throw new Error(`Unexpected tables: ${tables.join(',')}`);
          if (db.prepare('PRAGMA integrity_check').get().integrity_check !== 'ok') throw new Error('Database integrity check failed');
          console.log(JSON.stringify({ tables, sites: db.prepare('SELECT COUNT(*) AS count FROM sites').get().count, queued_pages: db.prepare('SELECT COUNT(*) AS count FROM site_pages').get().count }, null, 2));
          db.close();
          NODE
      - name: Save local crawler database
        run: |
          set -euo pipefail
          target_ref="${GITHUB_REF_NAME:-main}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git add db/crawler.sqlite
            if git diff --cached --quiet; then
              echo "No database changes to commit."
              exit 0
            fi
            git commit -m "Run discovery spider and update local database"
            if git push origin "HEAD:${target_ref}"; then
              echo "Discovery database pushed successfully to ${target_ref} on attempt ${attempt}."
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Unable to push discovery database after ${attempt} attempts." >&2
              exit 1
            fi
            echo "Remote changed during push; refreshing and repeating discovery (attempt $((attempt + 1)))."
            git fetch origin "${target_ref}"
            git reset --hard "origin/${target_ref}"
            node crawler/src/cli.mjs init
            node tools/discovery-spider.mjs
          done
