name: Migrate crawler database to Supabase

on:
  workflow_dispatch:
    inputs:
      batch_size:
        description: Rows per Supabase upload batch
        required: false
        default: '500'
        type: string

permissions:
  contents: read

concurrency:
  group: baheth-supabase-migration
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: https://ysntytwkggxdapokglsc.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_MIGRATION_BATCH_SIZE: ${{ inputs.batch_size || '500' }}
      CRAWLER_INPUT_DB_PATH: db/crawler.sqlite
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate migration secret
        run: test -n "$SUPABASE_SERVICE_ROLE_KEY"
      - name: Verify local source database
        run: node tools/verify-local-crawler-db.mjs
      - name: Upload local crawler data to Supabase
        run: node tools/migrate-local-db-to-supabase.mjs
      - name: Verify Supabase row counts
        run: |
          node --input-type=module <<'NODE'
          const base = `${process.env.SUPABASE_URL}/rest/v1`;
          const headers = { apikey: process.env.SUPABASE_SERVICE_ROLE_KEY, Authorization: `Bearer ${process.env.SUPABASE_SERVICE_ROLE_KEY}` };
          const tables = ['crawler_sites', 'crawler_queue', 'crawler_results'];
          const counts = {};
          for (const table of tables) {
            const response = await fetch(`${base}/${table}?select=id`, { headers });
            if (!response.ok) throw new Error(`${table}: ${response.status} ${await response.text()}`);
            counts[table] = Number(response.headers.get('content-range')?.split('/')[1] || 0);
          }
          console.log(JSON.stringify(counts, null, 2));
          NODE
