name: Reset Production Only

on:
  workflow_dispatch:
    inputs:
      confirm_reset:
        description: Type RESET_PRODUCTION_ONLY to backup then clear production
        required: true
        type: string

permissions:
  contents: read

jobs:
  reset:
    if: ${{ github.event.inputs.confirm_reset == 'RESET_PRODUCTION_ONLY' }}
    runs-on: ubuntu-latest
    env:
      TURSO_PRODUCTION_DATABASE_URL: ${{ secrets.TURSO_PRODUCTION_DATABASE_URL }}
      TURSO_PRODUCTION_AUTH_TOKEN: ${{ secrets.TURSO_PRODUCTION_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Backup and clear production only
        run: node tools/reset-production-only.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: production-backup-${{ github.run_id }}
          path: |
            production-backup-*.tar.gz
            production-backup-*.tar.gz.sha256
            production-backup-*/manifest.json
            production-backup-*/reset-verification.json
          retention-days: 90
