name: Production Read Stress Test
on:
  workflow_dispatch:
    inputs:
      reads:
        description: Number of read requests
        required: false
        default: '200'
      concurrency:
        description: Concurrent read workers
        required: false
        default: '20'
jobs:
  stress:
    runs-on: ubuntu-latest
    env:
      TURSO_PRODUCTION_DATABASE_URL: ${{ secrets.TURSO_PRODUCTION_DATABASE_URL }}
      TURSO_PRODUCTION_AUTH_TOKEN: ${{ secrets.TURSO_PRODUCTION_AUTH_TOKEN }}
      STRESS_READS: ${{ inputs.reads }}
      STRESS_CONCURRENCY: ${{ inputs.concurrency }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Run read-only production stress test
        run: node tools/stress-production-read.mjs
