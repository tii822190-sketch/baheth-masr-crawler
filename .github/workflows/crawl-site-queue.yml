name: Crawl One Queued Site
on:
  workflow_dispatch:
    inputs:
      queue_action:
        description: Queue action
        required: true
        default: run
        type: choice
        options: [run, add, list, reset]
      urls:
        description: Comma-separated URLs to add when queue_action is add
        required: false
        default: ''
      batch_size:
        description: Pages per checkpoint batch
        required: false
        default: '50'
      max_pages:
        description: Maximum pages for this site in this run
        required: false
        default: '500'
      queue_id:
        description: Queue ID for reset
        required: false
        default: ''
concurrency:
  group: baheth-crawler-staging-write
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  queue:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TURSO_CRAWLER_DATABASE_URL: libsql://alzahf-karamkkr.aws-eu-west-1.turso.io
      TURSO_CRAWLER_AUTH_TOKEN: ${{ secrets.TURSO_CRAWLER_AUTH_TOKEN }}
      TURSO_PRODUCTION_DATABASE_URL: ${{ secrets.TURSO_PRODUCTION_DATABASE_URL }}
      TURSO_PRODUCTION_AUTH_TOKEN: ${{ secrets.TURSO_PRODUCTION_AUTH_TOKEN }}
      CRAWLER_INPUT_DB_PATH: db/links.sqlite
      CRAWLER_RESULTS_DB_PATH: db/results.sqlite
      CRAWLER_LIMIT: '1'
      CRAWLER_DDG_QUERIES: ''
      CRAWLER_DRAIN_DISCOVERIES: '1'
      CRAWLER_MANUAL_ONLY: '1'
      CRAWLER_CONCURRENCY: '10'
      CRAWLER_BROWSER_CONCURRENCY: '7'
      CRAWLER_FETCH_MODE: 'hybrid'
      CRAWLER_BATCH_SIZE: ${{ inputs.batch_size || '50' }}
      CRAWLER_MAX_PAGES: ${{ inputs.max_pages || '500' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Apply crawler schema
        run: node tools/apply-turso-schema.mjs
      - name: Acquire staging write lock
        run: node tools/turso-job-lock.mjs acquire
      - name: Add URLs to queue
        if: github.event_name == 'workflow_dispatch' && inputs.queue_action == 'add'
        env:
          QUEUE_URLS: ${{ inputs.urls }}
        run: node tools/crawl-queue.mjs add "$QUEUE_URLS"
      - name: List queue
        if: github.event_name == 'workflow_dispatch' && inputs.queue_action == 'list'
        run: node tools/crawl-queue.mjs list
      - name: Reset queue item
        if: github.event_name == 'workflow_dispatch' && inputs.queue_action == 'reset'
        env:
          QUEUE_ID: ${{ inputs.queue_id }}
        run: node tools/crawl-queue.mjs reset "$QUEUE_ID"
      - name: Claim one queued site
        id: claim
        if: github.event_name == 'schedule' || inputs.queue_action == 'run'
        run: node tools/crawl-queue.mjs claim
      - name: Initialize crawler databases
        if: steps.claim.outputs.claimed == 'true'
        run: node crawler/src/cli.mjs init
      - name: Clear local seed data
        if: steps.claim.outputs.claimed == 'true'
        run: node tools/clear-local-staging.mjs
      - name: Restore previous crawler checkpoint
        if: steps.claim.outputs.claimed == 'true'
        run: node tools/restore-turso-staging.mjs
      - name: Set claimed URL
        if: steps.claim.outputs.claimed == 'true'
        env:
          QUEUE_URL: ${{ steps.claim.outputs.queue_url }}
        run: |
          echo "CRAWLER_MANUAL_URL=$QUEUE_URL" >> "$GITHUB_ENV"
          echo "CRAWLER_FORCE_MANUAL_URL=1" >> "$GITHUB_ENV"
      - name: Initialize fallback page crawler
        if: (github.event_name == 'schedule' || inputs.queue_action == 'run') && steps.claim.outputs.claimed != 'true'
        run: |
          node crawler/src/cli.mjs init
          node tools/restore-turso-staging.mjs
      - name: Crawl unindexed pages when site queue is empty
        if: (github.event_name == 'schedule' || inputs.queue_action == 'run') && steps.claim.outputs.claimed != 'true'
        env:
          CRAWLER_SOURCE: 'unindexed_pages'
          CRAWLER_ONE_BATCH: '1'
          CRAWLER_BATCH_SIZE: ${{ inputs.batch_size || '50' }}
          CRAWLER_MAX_PAGES: ${{ inputs.max_pages || '500' }}
          CRAWLER_MANUAL_ONLY: '1'
        run: |
          set -e
          processed_pages=0
          while [ "$processed_pages" -lt "$CRAWLER_MAX_PAGES" ]; do
            remaining=$((CRAWLER_MAX_PAGES - processed_pages))
            current_batch_size=$CRAWLER_BATCH_SIZE
            if [ "$current_batch_size" -gt "$remaining" ]; then current_batch_size=$remaining; fi
            export CRAWLER_BATCH_SIZE="$current_batch_size"
            crawl_output=$(node crawler/src/cli.mjs manual)
            echo "$crawl_output"
            export CRAWLER_SYNC_RUN_ID=$(node -e "const x=JSON.parse(process.argv[1]); console.log(Number(x.runId)||0)" "$crawl_output")
            processed=$(node -e "const x=JSON.parse(process.argv[1]); console.log(Number(x.total)||0)" "$crawl_output")
            processed_pages=$((processed_pages + processed))
            node tools/validate-staging.mjs
            node tools/sync-turso-staging.mjs
            if ! sync_output=$(node tools/sync-approved-production.mjs 2>&1); then
              echo "$sync_output"
              if ! echo "$sync_output" | grep -q 'No approved staging rows available'; then exit 1; fi
            else
              echo "$sync_output"
            fi
            if [ "$processed" -eq 0 ]; then break; fi
          done
      - name: Crawl site in checkpoint batches
        if: steps.claim.outputs.claimed == 'true'
        run: |
          set -e
          complete=false
          processed_pages=0
          batch=0
          while [ "$processed_pages" -lt "$CRAWLER_MAX_PAGES" ]; do
            batch=$((batch + 1))
            remaining=$((CRAWLER_MAX_PAGES - processed_pages))
            current_batch_size=$CRAWLER_BATCH_SIZE
            if [ "$current_batch_size" -gt "$remaining" ]; then current_batch_size=$remaining; fi
            export CRAWLER_BATCH_SIZE="$current_batch_size"
            echo "Starting page batch $batch (size=$CRAWLER_BATCH_SIZE, total limit=$CRAWLER_MAX_PAGES)"
            crawl_output=$(node crawler/src/cli.mjs manual)
            echo "$crawl_output"
            export CRAWLER_SYNC_RUN_ID=$(node -e "const x=JSON.parse(process.argv[1]); console.log(Number(x.runId)||0)" "$crawl_output")
            processed=$(node -e "const x=JSON.parse(process.argv[1]); console.log(Number(x.total)||0)" "$crawl_output")
            processed_pages=$((processed_pages + processed))
            node tools/validate-staging.mjs
            node tools/sync-turso-staging.mjs
            if ! sync_output=$(node tools/sync-approved-production.mjs 2>&1); then
              echo "$sync_output"
              if ! echo "$sync_output" | grep -q 'No approved staging rows available'; then exit 1; fi
            else
              echo "$sync_output"
            fi
            status=$(node tools/crawl-local-status.mjs)
            echo "$status"
            pending=$(node -e "const x=JSON.parse(process.argv[1]); console.log(Number(x.pending)+Number(x.queued)+Number(x.pending_targets))" "$status")
            if [ "$pending" -eq 0 ]; then complete=true; break; fi
            if [ "$processed" -eq 0 ]; then break; fi
          done
          if [ "$complete" != true ]; then
            echo "Maximum pages reached ($processed_pages); site remains processing for the next scheduled run."
            exit 0
          fi
          echo 'CRAWLER_SITE_COMPLETE=true' >> "$GITHUB_ENV"
      - name: Mark site done
        if: success() && steps.claim.outputs.claimed == 'true' && env.CRAWLER_SITE_COMPLETE == 'true'
        env:
          QUEUE_ID: ${{ steps.claim.outputs.queue_id }}
        run: node tools/crawl-queue.mjs done "$QUEUE_ID"
      - name: Mark site failed for retry
        if: failure() && steps.claim.outputs.claimed == 'true'
        env:
          QUEUE_ID: ${{ steps.claim.outputs.queue_id }}
        run: node tools/crawl-queue.mjs fail "$QUEUE_ID" "GitHub Actions crawl failed; scheduled retry will try again"
      - uses: actions/upload-artifact@v4
        if: always() && steps.claim.outputs.claimed == 'true'
        with:
          name: queued-crawler-${{ github.run_id }}
          path: db/*.sqlite
      - name: Release staging write lock
        if: always()
        run: node tools/turso-job-lock.mjs release || true
