name: Indexed Sites Monitor
on:
  schedule:
    - cron: '20 */3 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: baheth-crawler-staging-write
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TURSO_CRAWLER_DATABASE_URL: libsql://alzahf-karamkkr.aws-eu-west-1.turso.io
      TURSO_CRAWLER_AUTH_TOKEN: ${{ secrets.TURSO_CRAWLER_AUTH_TOKEN }}
      CRAWLER_INPUT_DB_PATH: db/links.sqlite
      MONITOR_MAX_SITES: '25'
      MONITOR_MAX_NEW_PAGES: '1000'
      MONITOR_TIMEOUT_MS: '10000'
      MONITOR_BROWSER_BUDGET_MS: '6000'
      MONITOR_MAX_MAPS_PER_SITE: '40'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: node tools/apply-turso-schema.mjs
      - run: rm -f db/links.sqlite db/results.sqlite
      - run: node crawler/src/cli.mjs init
      - run: node tools/clear-local-staging.mjs
      - run: node tools/restore-turso-staging.mjs
      - name: Acquire staging write lock
        run: node tools/turso-job-lock.mjs acquire
      - name: Monitor indexed sites and queue new pages
        run: node tools/indexed-sites-monitor.mjs
      - name: Release staging write lock
        if: always()
        run: node tools/turso-job-lock.mjs release || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: indexed-sites-monitor-${{ github.run_id }}
          path: db/links.sqlite
