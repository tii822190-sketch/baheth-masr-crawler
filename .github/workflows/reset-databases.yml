name: Reset Baheth Masr Databases

on:
  workflow_dispatch:
    inputs:
      confirm_reset:
        description: Type RESET_BAheth_MASR to confirm backup then reset
        required: true
        type: string

permissions:
  contents: read

jobs:
  reset:
    if: ${{ github.event.inputs.confirm_reset == 'RESET_BAheth_MASR' }}
    runs-on: ubuntu-latest
    env:
      TURSO_PRODUCTION_DATABASE_URL: ${{ secrets.TURSO_PRODUCTION_DATABASE_URL }}
      TURSO_PRODUCTION_AUTH_TOKEN: ${{ secrets.TURSO_PRODUCTION_AUTH_TOKEN }}
      TURSO_CRAWLER_DATABASE_URL: libsql://alzahf-karamkkr.aws-eu-west-1.turso.io
      TURSO_CRAWLER_AUTH_TOKEN: ${{ secrets.TURSO_CRAWLER_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Backup and reset both databases
        run: node tools/reset-databases.mjs
      - name: Verify archive checksum
        run: sha256sum -c reset-backup-*.tar.gz.sha256 && tar -tzf reset-backup-*.tar.gz >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: baheth-masr-reset-backup-${{ github.run_id }}
          path: |
            reset-backup-*.tar.gz
            reset-backup-*.tar.gz.sha256
            reset-backup-*/reset-manifest.json
            reset-backup-*/production-manifest.json
            reset-backup-*/staging-manifest.json
            reset-backup-*/production-reset-verification.json
            reset-backup-*/staging-reset-verification.json
          retention-days: 90
