name: Page Indexer

on:
  workflow_dispatch:
    inputs:
      batch_size:
        description: Pages per batch
        required: false
        default: '20'
      max_pages:
        description: Maximum pages per run
        required: false
        default: '20'
  schedule:
    - cron: '0 3,6,10,15,20,23 * * *'

concurrency:
  group: baheth-local-crawler-db
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CRAWLER_INPUT_DB_PATH: db/crawler.sqlite
      CRAWLER_SOURCE: unindexed_pages
      CRAWLER_FETCH_MODE: hybrid
      CRAWLER_BATCH_SIZE: ${{ inputs.batch_size || '20' }}
      CRAWLER_MAX_PAGES: ${{ inputs.max_pages || '20' }}
      CRAWLER_CONCURRENCY: '10'
      CRAWLER_BROWSER_CONCURRENCY: '10'
      CRAWLER_BROWSER_BUDGET_MS: '15000'
      CRAWLER_PAGE_TIMEOUT_MS: '120000'
      CRAWLER_RETRIES: '1'
      CRAWLER_REVIEW_RETRIES: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Initialize the three-table local database
        run: node crawler/src/cli.mjs init
      - name: Run the primary crawler
        run: node crawler/src/cli.mjs manual | tee /tmp/primary-crawler-result.json
      - name: Verify local database
        run: |
          node --input-type=module <<'NODE'
          import Database from 'better-sqlite3';
          const db = new Database('db/crawler.sqlite', { readonly: true });
          const tables = db.prepare("SELECT name FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%' ORDER BY name").all().map((row) => row.name);
          if (tables.join(',') !== 'index_results,site_pages,sites') throw new Error(`Unexpected tables: ${tables.join(',')}`);
          if (db.prepare('PRAGMA integrity_check').get().integrity_check !== 'ok') throw new Error('Database integrity check failed');
          console.log(JSON.stringify({ tables, index_results: db.prepare('SELECT COUNT(*) AS count FROM index_results').get().count, queued_pages: db.prepare("SELECT COUNT(*) AS count FROM site_pages WHERE crawl_status IN ('pending','queued','needs_review')").get().count }, null, 2));
          db.close();
          NODE
      - name: Commit updated local database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add db/crawler.sqlite
          if git diff --cached --quiet; then
            echo "No database changes to commit."
          else
            git commit -m "Run primary crawler and update local database"
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: page-indexer-${{ github.run_id }}
          path: |
            db/crawler.sqlite
            /tmp/primary-crawler-result.json
          retention-days: 7
