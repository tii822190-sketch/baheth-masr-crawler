name: Page Indexer

on:
  workflow_dispatch:
    inputs:
      batch_size:
        description: Pages per batch
        required: false
        default: '2000'
        type: string
      max_pages:
        description: Maximum pages per run
        required: false
        default: '2000'
        type: string
  schedule:
    # GitHub Actions default timezone (UTC): 02:00, 03:40, 05:20, 07:00, 08:40, 10:20, 12:00, 13:40, 15:20, and 17:00.
    - cron: '0 2,7,12,17 * * *'
    - cron: '40 3,8,13 * * *'
    - cron: '20 5,10,15 * * *'

concurrency:
  group: baheth-local-crawler-db
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      CRAWLER_INPUT_DB_PATH: /tmp/crawler.sqlite
      SUPABASE_URL: https://ysntytwkggxdapokglsc.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_SYNC_QUEUE_DELETES: 'true'
      CRAWLER_FETCH_MODE: hybrid
      CRAWLER_BATCH_SIZE: ${{ inputs.batch_size || '2000' }}
      CRAWLER_MAX_PAGES: ${{ inputs.max_pages || '2000' }}
      CRAWLER_CONCURRENCY: '15'
      CRAWLER_BROWSER_CONCURRENCY: '5'
      CRAWLER_BROWSER_BUDGET_MS: '10000'
      CRAWLER_PAGE_TIMEOUT_MS: '60000'
      # Stop accepting new pages at one hour, leaving time to verify and push the partial batch.
      CRAWLER_RUN_BUDGET_MS: '3600000'
      CRAWLER_RETRIES: '0'
      CRAWLER_REVIEW_RETRIES: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate Supabase secret
        run: test -n "$SUPABASE_SERVICE_ROLE_KEY"
      - name: Pull crawler state from Supabase
        run: node tools/pull-supabase-to-local.mjs
      - name: Initialize the temporary crawler database
        run: node crawler/src/cli.mjs init
      - name: Run up to 2000 queued pages with graceful 80-minute budget
        run: bash tools/run-primary-crawler.sh
      - name: Verify local database
        run: node tools/verify-local-crawler-db.mjs
      - name: Push updated crawler state to Supabase
        run: node tools/push-local-to-supabase.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: page-indexer-${{ github.run_id }}
          path: |
            /tmp/crawler.sqlite
            /tmp/primary-crawler-result.json
            /tmp/primary-crawler-result.jsonl
          retention-days: 7
