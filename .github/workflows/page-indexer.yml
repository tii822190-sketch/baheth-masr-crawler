name: Page Indexer
on:
  schedule:
    - cron: '0 3,6,10,15,20,23 * * *'
  workflow_dispatch:
    inputs:
      batch_size:
        description: Pages per batch
        required: false
        default: '50'
      max_pages:
        description: Maximum pages per run
        required: false
        default: '500'
      sync_production:
        description: Sync approved rows to production after validation
        required: false
        default: 'true'
        type: boolean
concurrency:
  group: baheth-crawler-staging-write
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TURSO_CRAWLER_DATABASE_URL: libsql://alzahf-karamkkr.aws-eu-west-1.turso.io
      TURSO_CRAWLER_AUTH_TOKEN: ${{ secrets.TURSO_CRAWLER_AUTH_TOKEN }}
      TURSO_PRODUCTION_DATABASE_URL: ${{ secrets.TURSO_PRODUCTION_DATABASE_URL }}
      TURSO_PRODUCTION_AUTH_TOKEN: ${{ secrets.TURSO_PRODUCTION_AUTH_TOKEN }}
      CRAWLER_INPUT_DB_PATH: db/links.sqlite
      CRAWLER_RESULTS_DB_PATH: db/results.sqlite
      CRAWLER_SOURCE: unindexed_pages
      CRAWLER_SEED_STAGING: '0'
      CRAWLER_DISCOVERY_MODE: '0'
      CRAWLER_MANUAL_ONLY: '1'
      CRAWLER_FETCH_MODE: hybrid
      CRAWLER_CONCURRENCY: '10'
      CRAWLER_BROWSER_CONCURRENCY: '7'
      CRAWLER_BROWSER_BUDGET_MS: '15000'
      CRAWLER_DRAIN_DISCOVERIES: '0'
      CRAWLER_ONE_BATCH: '1'
      CRAWLER_RETRY_FAILED: '0'
      CRAWLER_BATCH_SIZE: ${{ inputs.batch_size || '50' }}
      CRAWLER_MAX_PAGES: ${{ inputs.max_pages || '500' }}
      SYNC_PRODUCTION: ${{ inputs.sync_production || 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: node tools/apply-turso-schema.mjs
      - run: rm -f db/links.sqlite db/results.sqlite
      - run: node crawler/src/cli.mjs init
      - run: node tools/clear-local-staging.mjs
      - run: node tools/restore-turso-staging.mjs
      - name: Acquire staging write lock
        run: node tools/turso-job-lock.mjs acquire
      - name: Index pages from site_pages only
        run: |
          set -e
          processed_pages=0
          while [ "$processed_pages" -lt "$CRAWLER_MAX_PAGES" ]; do
            remaining=$((CRAWLER_MAX_PAGES - processed_pages))
            current_batch_size=$CRAWLER_BATCH_SIZE
            if [ "$current_batch_size" -gt "$remaining" ]; then current_batch_size=$remaining; fi
            export CRAWLER_BATCH_SIZE="$current_batch_size"
            output=$(node crawler/src/cli.mjs manual)
            echo "$output"
            export CRAWLER_SYNC_RUN_ID=$(node -e "const x=JSON.parse(process.argv[1]); console.log(Number(x.runId)||0)" "$output")
            processed=$(node -e "const x=JSON.parse(process.argv[1]); console.log(Number(x.total)||0)" "$output")
            processed_pages=$((processed_pages + processed))
            if ! validation=$(node tools/validate-staging.mjs 2>&1); then
              echo "Validation completed with non-blocking row-level issues:"
              echo "$validation"
            else
              echo "$validation"
            fi
            node tools/sync-turso-staging.mjs
            if [ "$SYNC_PRODUCTION" = "true" ]; then
              sync_status=0
              sync=$(node tools/sync-approved-production.mjs 2>&1) || sync_status=$?
              echo "$sync"
              if [ "$sync_status" -ne 0 ]; then
                echo "Production sync returned non-zero status $sync_status; retaining staging results for the next scheduled run."
              else
                echo "Production sync completed."
                node tools/mark-synced-staging.mjs
                node tools/sync-turso-staging.mjs
              fi
            else
              echo "Production sync disabled for this run; results remain in staging."
            fi
            node tools/turso-job-lock.mjs heartbeat
            if [ "$processed" -eq 0 ]; then
              break
            fi
          done
      - name: Release staging write lock
        if: always()
        run: node tools/turso-job-lock.mjs release || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: page-indexer-${{ github.run_id }}
          path: db/*.sqlite
