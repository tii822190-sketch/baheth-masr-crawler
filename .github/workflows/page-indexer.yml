name: Page Indexer

on:
  workflow_dispatch:
    inputs:
      batch_size:
        description: Pages per batch
        required: false
        default: '2000'
        type: string
      max_pages:
        description: Maximum pages per run
        required: false
        default: '2000'
        type: string
  schedule:
    # GitHub Actions default timezone (UTC): 02:00, 03:40, 05:20, 07:00, 08:40, 10:20, 12:00, 13:40, 15:20, and 17:00.
    - cron: '0 2,7,12,17 * * *'
    - cron: '40 3,8,13 * * *'
    - cron: '20 5,10,15 * * *'

concurrency:
  group: baheth-local-crawler-db
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CRAWLER_INPUT_DB_PATH: db/crawler.sqlite
      CRAWLER_FETCH_MODE: hybrid
      CRAWLER_BATCH_SIZE: ${{ inputs.batch_size || '2000' }}
      CRAWLER_MAX_PAGES: ${{ inputs.max_pages || '2000' }}
      CRAWLER_CONCURRENCY: '10'
      CRAWLER_BROWSER_CONCURRENCY: '3'
      CRAWLER_BROWSER_BUDGET_MS: '15000'
      CRAWLER_PAGE_TIMEOUT_MS: '120000'
      CRAWLER_RETRIES: '1'
      CRAWLER_REVIEW_RETRIES: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Initialize the local three-table database
        run: node crawler/src/cli.mjs init
      - name: Run up to 2000 queued pages
        run: bash tools/run-primary-crawler.sh
      - name: Verify local database
        run: node tools/verify-local-crawler-db.mjs
      - name: Commit updated local database
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git add db/crawler.sqlite
            if git diff --cached --quiet; then
              echo "No database changes to commit."
              exit 0
            fi
            git commit -m "Run primary crawler and update local database"
            if git push origin HEAD:main; then
              echo "Database commit pushed successfully on attempt ${attempt}."
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Unable to push database after ${attempt} attempts." >&2
              exit 1
            fi
            echo "Remote changed during push; refreshing database and retrying crawler (attempt $((attempt + 1)))."
            git fetch origin main
            git reset --hard origin/main
            node crawler/src/cli.mjs init
            bash tools/run-primary-crawler.sh
            node tools/verify-local-crawler-db.mjs
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: page-indexer-${{ github.run_id }}
          path: |
            db/crawler.sqlite
            /tmp/primary-crawler-result.json
            /tmp/primary-crawler-result.jsonl
          retention-days: 7
