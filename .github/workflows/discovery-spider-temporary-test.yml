name: Temporary Discovery Spider Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CRAWLER_DB_PATH: /tmp/crawler-discovery-test.sqlite
      DISCOVERY_MAX_PAGES_PER_SITE: '10000'
      DISCOVERY_MAX_SITEMAPS: '2000'
      DISCOVERY_TIMEOUT_MS: '20000'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Create temporary database and seed only the two test sites
        run: |
          node --input-type=module <<'NODE'
          import Database from 'better-sqlite3';
          const db = new Database(process.env.CRAWLER_DB_PATH);
          db.exec(`
            CREATE TABLE sites (
              id INTEGER PRIMARY KEY AUTOINCREMENT,
              url TEXT NOT NULL UNIQUE,
              crawl_status TEXT NOT NULL DEFAULT 'pending',
              created_at TEXT NOT NULL DEFAULT CURRENT_TIMESTAMP,
              updated_at TEXT NOT NULL DEFAULT CURRENT_TIMESTAMP
            );
            CREATE TABLE pages_queue (
              id INTEGER PRIMARY KEY AUTOINCREMENT,
              site_id INTEGER NOT NULL REFERENCES sites(id) ON DELETE CASCADE,
              url TEXT NOT NULL UNIQUE,
              indexed INTEGER NOT NULL DEFAULT 0,
              created_at TEXT NOT NULL DEFAULT CURRENT_TIMESTAMP,
              updated_at TEXT NOT NULL DEFAULT CURRENT_TIMESTAMP
            );
            CREATE INDEX idx_pages_queue_indexed ON pages_queue(indexed,id);
            CREATE INDEX idx_pages_queue_site ON pages_queue(site_id,indexed,id);
          `);
          const insert = db.prepare("INSERT INTO sites (url,crawl_status) VALUES (?,'pending')");
          insert.run('https://misrquran.gov.eg/');
          insert.run('https://codenex1.blogspot.com/');
          db.close();
          NODE
      - name: Run spider on both sites using temporary database only
        run: |
          set -e
          for site in 'https://misrquran.gov.eg/' 'https://codenex1.blogspot.com/'; do
            echo "===== TESTING $site ====="
            DISCOVERY_SITE_URL="$site" node tools/discovery-spider.mjs | tee -a /tmp/discovery-results.jsonl
          done
      - name: Print temporary test summary
        run: |
          node --input-type=module <<'NODE'
          import Database from 'better-sqlite3';
          const db = new Database(process.env.CRAWLER_DB_PATH, { readonly: true });
          const summary = db.prepare(`
            SELECT s.url,s.crawl_status,COUNT(p.id) AS pages,SUM(CASE WHEN p.indexed=0 THEN 1 ELSE 0 END) AS unindexed
            FROM sites s LEFT JOIN pages_queue p ON p.site_id=s.id GROUP BY s.id ORDER BY s.id
          `).all();
          console.log(JSON.stringify({ temporary_database: true, summary }, null, 2));
          db.close();
          NODE
          cp /tmp/crawler-discovery-test.sqlite discovery-spider-test.sqlite
      - uses: actions/upload-artifact@v4
        with:
          name: discovery-spider-temporary-test-${{ github.run_id }}
          path: |
            discovery-spider-test.sqlite
            /tmp/discovery-results.jsonl
          retention-days: 1
