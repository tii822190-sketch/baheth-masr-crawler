name: Browse Discovery Spider

on:
  workflow_dispatch:
    inputs:
      max_pages:
        description: Maximum pages to discover from rendered HTML
        required: false
        default: '10000'
        type: string

permissions:
  contents: write

concurrency:
  group: baheth-local-crawler-db-scheduled
  cancel-in-progress: false

jobs:
  browse:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      CRAWLER_DB_PATH: db/crawler.sqlite
      BROWSE_MAX_PAGES: ${{ inputs.max_pages || '10000' }}
      BROWSE_PAGE_TIMEOUT_MS: '30000'
      BROWSE_BROWSER_BUDGET_MS: '30000'
      BROWSE_SCROLL_STEPS: '6'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Initialize the local three-table database
        run: node crawler/src/cli.mjs init
      - name: Browse one not-pages site and collect rendered HTML links
        run: node tools/browse-discovery-spider.mjs
      - name: Verify local database
        run: |
          node --input-type=module <<'NODE'
          import Database from 'better-sqlite3';
          const db = new Database('db/crawler.sqlite', { readonly: true });
          const tables = db.prepare("SELECT name FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%' ORDER BY name").all().map((row) => row.name);
          if (tables.join(',') !== 'index_results,site_pages,sites') throw new Error(`Unexpected tables: ${tables.join(',')}`);
          if (db.prepare('PRAGMA integrity_check').get().integrity_check !== 'ok') throw new Error('Database integrity check failed');
          console.log(JSON.stringify({ tables, sites: db.prepare('SELECT COUNT(*) AS count FROM sites').get().count, queued_pages: db.prepare('SELECT COUNT(*) AS count FROM site_pages').get().count }, null, 2));
          db.close();
          NODE
      - name: Save local crawler database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add db/crawler.sqlite
          if git diff --cached --quiet; then
            echo "No database changes to commit."
          else
            git commit -m "Run browse discovery spider and update local database"
            git push origin HEAD:main
          fi
